[global]
pid_file = unifi-gateway.pid
disable_broadcast = True

[gateway]
is_adopted = False
ports = [ { "ifname": "eth0", "name": "WAN", "type": "wan", "realif": "eth1" }, { "ifname": "eth1", "name": "LAN", "type": "lan", "realif": "br-lan" }, { "ifname": "eth2", "name": "LAN2", "type": "lan2", "realif": "eth2" } ]
lan_ip = 192.168.1.1
lan_mac = 00:00:00:00:00:00
firmware = 4.4.18.5052168
device = UGW3
device_display = UniFi-Gateway-3
use_aes_gcm = False
# UXG mode (UniFi Gateway Max): device = UXGB, device_display = UniFi Gateway Max,
# firmware = 5.1.26.33914. Extra LAN ports may add "network": "br20" (their
# UDAPI interface) and "vlan": 20; the primary LAN reports as br0.
# hostname = my-gateway
# dhcp_lease_file = /tmp/dhcp.leases
# dhcp_lease_format = dnsmasq  ; dnsmasq, isc, or kea
# ping_target = ping.ubnt.com
# speedtest_file = ./speedtest.json
# platform = UNIFI-GW

# OPNsense REST API (platform = opnsense). Without a key the daemon falls back
# to plain FreeBSD collection and cannot act on controller config.
# [opnsense]
# url = https://127.0.0.1:443
# api_key =
# api_secret =
# verify_ssl = false
# apply_firewall = true
# apply_port_forward = true
# apply_dhcp = true
# apply_dns = true
# apply_routes = true
# block_clients = true
# allow_reboot = false
# traffic_interval = 30
# auto_ports = true
# netflow_db = /var/netflow/src_addr_000300.sqlite
# dpi = auto
# zenarmor_db = /usr/local/datastore/sqlite/conn_all.sqlite
# send Zenarmor connections as Traffic Flows (UXG models only)
# flows = false
# let UniFi Threat Management add rulesets/interfaces to Suricata (UXG only)
# ips = false

[provisioned]
